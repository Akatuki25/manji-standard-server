version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
  - local: ./node_modules/.bin/protoc-gen-connect-es
    out: src/gen
    opt:
      - target=ts
  # カスタムプラグイン: proto → Entity / Repository / InMemory 実装
  - local: ["node", "./tools/mss-protoc-gen.mjs"]
    out: .
    opt:
      - target=ts
