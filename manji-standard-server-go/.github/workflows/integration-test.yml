name: integration-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: "postgres://app:app@localhost:5432/app?sslmode=disable"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Install protoc plugins and buf
        run: make install-tools

      - name: Run proto-gen
        run: make proto-gen

      - name: Integration test
        # `-tags=integration` で囲まれたテストのみ実行。test/integration/ が未整備でも
        # go test は該当ファイルなしで exit 0 になるため CI は通る。
        run: go test -tags=integration -count=1 ./test/integration/...
