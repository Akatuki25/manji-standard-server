name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Install protoc plugins and buf
        run: make install-tools

      - name: Run proto-gen
        run: make proto-gen

      - name: go vet
        run: go vet ./...
