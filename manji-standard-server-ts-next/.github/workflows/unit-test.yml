name: unit-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate proto and check for drift
        run: |
          npm run proto:gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::proto generation is out of date. Run 'npm run proto:gen' locally and commit the result."
            git status
            git --no-pager diff
            exit 1
          fi

      - name: Build
        # Route Handler は force-dynamic のため build 時に DB 接続は発生しないが、
        # 依存ライブラリがダミー値を要求するケースに備えて設定しておく。
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
        run: npm run build

      - name: Unit test (exclude integration)
        run: npx vitest run --passWithNoTests --exclude 'test/integration/**'
